general {
        colors = true
        interval = 5
        color_good = "#C2D076"
        color_degraded = "#E9C46A"
        color_bad = "#540B0E"
}

order += "wireless _first_"
order += "battery all"
order += "tztime local"

wireless _first_ {
        format_up = "󰤥  %essid"
        format_down = "󰤮  offline"
}

battery all {
        format = "󱊣  %percentage"
        format_down = "󱊤  no bat"
}

tztime local {
        format = "  %d/%m  %H:%M"
}
